const slides=[];
const add=(chapter,type,title,body,note,refs=[],extra={})=>slides.push({chapter,type,title,body,note,refs,...extra});
const cards=(items,cols='three')=>`<div class="grid ${cols}">${items.map(([label,title,text])=>`<div class="card"><span class="label">${label}</span><h3>${title}</h3><p>${text}</p></div>`).join('')}</div>`;
const call=t=>`<div class="callout">${t}</div>`;
const flow=(items)=>`<div class="flow">${items.map(([name,desc],i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="step ${i===items.length-1?'highlight':''}">${name}<small>${desc}</small></div>`).join('')}</div>`;
const timeline=items=>`<div class="timeline">${items.map(([year,name,desc])=>`<div class="time"><div class="year">${year}</div><h3>${name}</h3><p>${desc}</p></div>`).join('')}</div>`;
const chapter=(n,word,q,sub)=>add(word,'chapter',`THE ${word}`,`<span class="label">CHAPTER ${String(n).padStart(2,'0')} / 06</span><div class="chapter-word">THE<br>${word}.</div><p class="chapter-q">${q}</p><p class="chapter-summary">${sub}</p><div class="chapter-index" aria-hidden="true">${String(n).padStart(2,'0')}</div>`,`이 장의 질문과 핵심 메시지를 바로 소개합니다. ${sub}`,[],{theme:'acid',custom:true});
add('INTRO','cover','다음 수를 생각하는 엔지니어',`<div class="split"><div><span class="label">A FIELD GUIDE FOR NEW ENGINEERS</span><h1>다음 수를<br>생각하는<br><span class="accent">엔지니어.</span></h1><p class="lead">AI는 더 많은 일을 할 수 있게 된다.<br>그때, 우리는 어떤 일을 해야 할까?</p><span class="tag">AI × AX</span><span class="tag">신입사원 교육</span><span class="tag">50–60 MIN</span></div><div class="cover-art" aria-label="37, 78, 다음 수를 나타낸 상징적 바둑 격자. 실제 기보가 아닙니다."><span class="art-label">A DIFFERENT WAY TO PLAY</span><span class="stone one">37</span><span class="stone two">78</span><span class="stone ghost">?</span><span class="art-bottom">WHAT IS YOUR NEXT MOVE?</span></div></div>`,'도입 1분. 이 강의는 AI 기능 소개나 미래 고용에 대한 단정이 아닙니다. 빠른 기술 변화 속에서 신입 엔지니어가 무엇을 배우고 어떤 책임을 맡을지 함께 생각하는 시간이라고 안내하세요. 표지 바둑판은 상징 그래픽이며 실제 37수·78수의 위치가 아닙니다.',[],{custom:true,foot:'사례·연구 확인 2026.09.14 · 미래 장면은 설명용 가상 시나리오'});
add('INTRO','takeaway','성장은 결과물이 아니라, 내 안에 남는 역량이다.',`<p class="statement">AI로 더 많이 만들고,<br><span class="accent">원리는 내 것으로 만든다.</span></p><p class="lead">결과물을 완성하는 것과 실력이 쌓이는 것은 다릅니다.<br>계산의 가정과 단위를 설명하고, 실험과의 차이를 해석할 수 있어야 성장입니다.</p>`,'도입 1분. 강의의 결론을 먼저 전달합니다. AI를 활용해 결과를 만들되 원리 이해, 검증 능력, 결과에 대한 책임을 함께 키워야 합니다. 뒤의 사례들은 이 결론의 근거와 적용 방법을 설명합니다.');
add('INTRO','map','여섯 개의 질문, 하나의 선택.',`<div class="route">${[['SPEED','속도','무엇이 달라지고 있는가'],['QUESTION','대체','내 일은 어떻게 바뀌는가'],['SHIFT','전환','일하는 구조를 바꿀 수 있는가'],['ENGINEER','역할','무엇을 설계하고 검증하는가'],['HUMAN','판단','무엇을 믿고 책임질 것인가'],['CHOICE','선택','나는 어떤 엔지니어가 될 것인가']].map(([id,ko,q],i)=>`<a href="#chapter-${id.toLowerCase()}"><span class="label">0${i+1} / ${ko}</span><b>THE ${id}</b><span>${q}</span></a>`).join('')}</div>`,'1분. 앞의 세 장은 기술과 일의 변화, 뒤의 세 장은 엔지니어 자신의 변화입니다. 사례가 입증하는 사실과 강의에서 이끌어내는 해석을 구분해서 듣도록 안내하세요.',[],{theme:'light'});
chapter(1,'SPEED','AI는 얼마나 빨리 발전하고 있는가?','모델의 점수보다, 맡길 수 있는 일의 단위를 보자.');
add('SPEED','case','2016. 우리가 놀란 것은 승패만이 아니었다.',`<div class="split"><div><span class="label">SEOUL / MARCH 2016</span><p class="statement">이세돌 <span class="orange">1</span><br>AlphaGo <span class="accent">4</span></p><p class="lead">직관의 영역으로 여겼던 바둑.<br>기계가 인간의 정상급 기사를 이겼다.</p></div><div><div class="big-number">37</div><p class="number-caption">2국의 37수<br>낯선 수가, 새로운 관점을 열었다.</p></div></div>`,'2분. 알파고는 2016년 3월 이세돌과의 다섯 판에서 4승 1패를 기록했습니다. 37수는 제2국에서 알파고가 둔 수입니다. 사람의 정석과 기대를 벗어난 수가 유효할 수 있다는 충격을 강조합니다. 이를 감정·의식의 증거나 모든 분야의 우월성으로 확대하지 마세요. 78수는 뒤에서 다룹니다.',['alpha']);
add('SPEED','timeline','대화하던 AI에게, 일을 맡기기 시작했다.',timeline([['2021','코드 제안','Copilot: 작성 중인 코드의 다음 부분을 제안.'],['2022.11','대화의 대중화','ChatGPT 공개: 자연어로 설명·초안·코드 요청.'],['2025.05','작업 위임','GitHub coding agent: 이슈를 받아 변경과 PR 작성.'],['질문의 변화','어떻게 쓰지? → 무엇을 맡기지?','한 줄의 출력에서, 여러 단계의 실행으로.']])+call('빠른 발전을 체감하는 단위: <strong>답변 → 수정 → 실행 → 피드백</strong>'),'2분. 마지막 칸은 연도가 아니라 강의의 해석입니다. 제품 출시가 모든 사용자·업무에서 안정적 성능을 보장하는 것은 아닙니다. 2021~2025의 분명한 변곡점을 통해 상호작용 단위의 변화를 설명합니다. 특정 제품의 최신 순위를 다루는 슬라이드가 아닙니다.',['chat','copilotHistory','copilot']);
add('SPEED','timeline','이미지 한 장에서, 소리 있는 장면까지.',timeline([['2021','DALL·E','문장으로 이미지의 개념을 조합.'],['2022','DALL·E 2','더 정교한 이미지 생성과 편집.'],['2024','Sora 연구 공개','텍스트로 긴 영상 장면 생성 시연.'],['2025','Veo 3','영상과 함께 대사·효과음 생성.']])+call('볼 질문: 얼마나 그럴듯한가? <strong>얼마나 의도대로 수정하고 유지할 수 있는가?</strong>'),'2분. 출처 링크에서 각 시기의 실제 공개 예시를 볼 수 있습니다. 강의 전 예시를 미리 골라 두면 좋습니다. 발표용 시연은 평균 성능과 다릅니다. 화질뿐 아니라 지시 준수, 인물·공간의 일관성, 수정 가능성을 비교하세요. Sora의 2024년 2월 연구 공개와 12월 제품 공개를 혼동하지 마세요. 생성된 비교 이미지를 역사적 원본처럼 보여주지 않습니다.',['dalle','sora','veo']);
add('SPEED','case','AI가, 다음 AI를 만드는 일을 돕는다.',flow([['제안','모델이 알고리즘 후보를 만든다.'],['실행·평가','자동 평가기로 정확성과 성능을 확인한다.'],['선택·개선','좋은 후보를 남기고 다시 탐색한다.']])+cards([['CASE / 2025','AlphaEvolve','Google은 데이터센터·칩·AI 학습 관련 알고리즘 최적화 사례를 공개했다.'],['BOUNDARY','목표와 평가기의 힘','사람이 문제, 제약, 평가 기준을 설계한다. 모든 연구가 자동화된 것은 아니다.']],'two'),'2분. 제품사·연구팀이 보고한 결과입니다. AlphaEvolve가 스스로 임의의 목표를 만들고 과학 전체를 해결한 것으로 설명하지 마세요. AI가 AI 개발에 필요한 계산과 알고리즘 개선에 기여한다는 사실과, 무제한의 자기 개선이 보장된다는 주장은 다릅니다. 엔지니어가 평가기를 만드는 역할로 자연스럽게 연결합니다.',['evolve']);
add('SPEED','evidence','성능의 발전과 내 생산성은 같은 곡선일까?',`<div class="split"><div><span class="label">METR / EARLY-2025 RCT</span><div class="big-number">+19<small>%</small></div><p class="number-caption">숙련 개발자의 작업 소요 시간 증가<br>16명 · 익숙한 오픈소스 저장소 · 246개 작업</p></div><div><h2>좋은 도구도<br>맥락에 따라 다르다.</h2><p class="lead">2026년 후속 보고는 개선 가능성을 언급했지만,<br>선택 편향 때문에 효과 크기를 확정하기 어렵다고 밝혔다.</p><div class="callout">우리 팀은 <strong>검토·재작업까지</strong> 측정하는가?</div></div></div>`,'2분. +19%는 정확도가 아니라 평균 소요 시간입니다. 2025년 초 도구와 숙련 유지관리자라는 제한된 조건의 결과입니다. 이를 현재의 모든 AI 도구가 느리다는 주장으로 쓰지 마세요. 2026년 후속 자료도 읽고 단정하지 않는 태도 자체를 보여줍니다. 작성 시간, 리뷰 시간, 결함, 재작업을 함께 측정하자고 제안합니다.',['metr','metrUpdate']);
chapter(2,'QUESTION','AI는 나를 대체할까?','역사는 한 가지 결말만 보여주지 않는다.');
add('QUESTION','case','Deep Blue가 이긴 뒤에도, 체스는 계속됐다.',cards([['1997','기계가 이겼다','Deep Blue가 세계 챔피언 카스파로프와의 매치에서 승리했다.'],['AFTER','경쟁의 규칙과 훈련','인간의 대회는 계속되고, 컴퓨터 분석은 준비와 학습의 도구가 되었다.'],['BUT','직업의 보장은 아니다','스포츠의 관람 가치와 기업의 생산성 경쟁은 서로 다른 조건이다.']])+call('기계가 더 잘한다는 사실만으로, 인간 활동의 가치가 모두 사라지지는 않는다.'),'2분. 체스 선수의 수입이나 고용이 일률적으로 늘었다고 주장하지 않습니다. 인간 간 경쟁 자체가 상품인 스포츠는 일반 업무와 다릅니다. 이 사례는 완전 대체라는 단일 서사를 흔드는 사례이지, 모든 엔지니어 일자리가 안전하다는 근거가 아닙니다.',['blue','centaur']);
add('QUESTION','case','ATM: 업무 하나가 줄어도, 직업은 재편될 수 있다.',flow([['현금 처리 자동화','지점당 필요한 창구 인력 감소'],['운영 비용 하락','당시 미국에서 지점 확대를 뒷받침'],['업무 이동','현금 처리에서 고객 관계·상품 안내로']])+call('그러나 온라인·모바일 뱅킹은 <strong>지점 방문 자체</strong>를 줄였다.')+`<p class="fine">미국의 역사적 사례입니다. BLS는 현재 은행원 고용의 장기 감소를 전망합니다.</p>`,'2분. Bessen의 2015년 설명은 미국의 특정 시기 이야기입니다. 자동화가 지점 확장과 결합하면서 창구 직원이 즉시 사라지지 않았다는 메커니즘을 설명합니다. 같은 직업도 다음 기술·수요 변화에서 다시 영향을 받습니다. BLS 전망은 미래 예상이며 한국이나 모든 국가에 그대로 적용하지 않습니다.',['atm','tellers']);
add('QUESTION','contrast','사진기, 자동차, 엘리베이터. 결말은 달랐다.',cards([['RECOMPOSITION','사진기와 화가','이미지 기록에 새 매체가 등장했다. 회화는 지속됐지만, 모든 화가의 생계가 보장된 것은 아니다.'],['SUBSTITUTION','자동차와 마부','이동 수요는 남아도 마차를 모는 일은 축소됐다. 새 산업의 일자리로 자동 이동되지는 않는다.'],['DISAPPEARANCE','엘리베이터 운전원','문·속도·정지 제어가 자동화되며 미국에서 직무가 크게 사라졌다.']])+call('남는 것은 “수요”일 수 있다. <strong>내 직무와 고용</strong>이 그대로 남는다는 뜻은 아니다.'),'2분. 세 사례를 산업 재편의 서로 다른 유형으로 읽어 주세요. 사진이 인상주의를 단독으로 탄생시켰다는 식의 인과관계는 피합니다. 마부가 전부 운전기사가 됐다는 서사도 피합니다. 기술 전환의 이득과 전환 비용이 서로 다른 사람에게 갈 수 있다는 점이 핵심입니다.',['photo','carriage','elevator'],{theme:'light'});
add('QUESTION','case','러다이트의 질문은, 기술만의 문제가 아니었다.',`<p class="statement">생산성이 올라갈 때,<br><span class="accent">누가 이익을 얻고<br>누가 전환 비용을 치르는가?</span></p><p class="lead">1811년 이후 영국의 노동자들은 기계 파괴뿐 아니라<br>청원과 집단행동으로 생계·임금·노동 조건의 문제를 제기했다.</p>`,'1분 30초. 러다이트를 미래를 몰랐던 사람들의 조롱거리로 만들지 마세요. 기계 파괴의 역사적 사실과 생계·노동 조건의 맥락을 함께 설명합니다. 조직의 재교육, 주니어 채용, 이익 배분도 AX의 일부라는 질문으로 연결하세요.',['luddite']);
add('QUESTION','comparison','직업명 대신, 업무를 분해해 보면.',cards([['TRANSLATOR','번역가','초벌 번역 → 용어·문맥 검수 → 고객 목적 확인'],['DEVELOPER','개발자','코드 초안 → 요구 해석 → 통합 시험 → 장애 대응'],['DESIGN ENGINEER','설계 엔지니어','자료·계산 초안 → 제약 검토 → 시제품 시험 → 설계 변경']])+call('초안을 싸게 만드는 힘은 기회이면서, <strong>단가와 입문 업무에 대한 압력</strong>일 수 있다.')+`<p class="fine">업무 분해는 강의용 분석입니다. 사용량 데이터는 실직률이나 전체 노동시장의 인과 효과가 아닙니다.</p>`,'2분. Anthropic의 사용 데이터에서는 소프트웨어 개발과 기술 문서 작업이 두드러집니다. 이를 모든 번역가·개발자의 소득 감소가 입증됐다는 뜻으로 읽지 않습니다. 실제 조직에서는 초벌 작업 자동화, 검수 수요, 가격 압박이 함께 나타날 수 있다는 분석을 제시하세요. 설계 엔지니어의 업무 분해는 강의용 예시이며 이 사용 데이터가 하드웨어 설계의 자동화 효과까지 입증하는 것은 아닙니다. 입문 업무에서 배우는 기회도 함께 설계해야 합니다.',['economic']);
add('QUESTION','takeaway','이상 원인 분석: AI의 가설을, 실험으로 검증한다.',`<span class="label">예시 / 모터 시험 중 예상보다 큰 온도 상승</span><div class="question-card"><b>01</b>AI: 측정 기록을 정리하고 원인 후보를 제안한다.</div><div class="question-card"><b>02</b>엔지니어: 센서·부하·냉각 조건을 확인하고 가설을 검증한다.</div><div class="question-card"><b>03</b>팀: 시험 기준에 따라 중단·재시험·설계 변경을 결정한다.</div>${call('그럴듯한 원인 후보는 <strong>검증된 원인</strong>이 아니다.')}`,'1분. 실험실에서 예상과 다른 결과를 만났던 경험에 연결합니다. 모터 온도 상승은 강의용 가상 사례입니다. AI의 원인 후보를 결론으로 쓰지 않고 측정계와 시험 조건을 확인한 뒤 가설을 검증합니다. 실제 시험 절차와 판단 권한은 조직 기준을 따릅니다.',[],{theme:'acid'});
chapter(3,'SHIFT','AX는 무엇을 바꾸는가?','도구를 추가하는 일에서, 업무의 구조를 다시 설계하는 일로.');
add('SHIFT','definition','AX = AI Transformation',`<p class="statement">AI를 전제로<br><span class="accent">일·역할·의사결정·측정을</span><br>다시 설계하는 것.</p><p class="lead">이 강의에서 사용할 정의입니다.<br>“AI 계정을 지급했다”는 시작일 수 있어도, 전환의 완성은 아닙니다.</p>`,'1분. AX는 여기서 AI Transformation의 실무적 정의로 씁니다. 보편적으로 합의된 유일한 표준 정의처럼 말하지 않습니다. 사람을 무조건 루프에서 빼는 것이 아니라, 어디서 판단하고 어떤 근거를 남길지 재설계하는 것이라고 설명하세요.');
add('SHIFT','diagram','공장에 전기를 넣는 것만으로는 부족했다.',cards([['BEFORE / 증기기관 중심','동력축에 맞춘 공장','큰 동력원과 벨트·축을 중심으로 기계를 배치. 동력 전달 구조가 작업 배치를 제약했다.'],['AFTER / 개별 전기 모터','작업 흐름에 맞춘 공장','기계를 생산 순서에 맞춰 재배치하고, 공정·건물·조직을 함께 바꿀 여지가 생겼다.']],'two')+flow([['새 동력','전기 도입'],['보완 투자','배치·설비·업무 재설계'],['생산성','시간을 두고 효과 실현']]),'2분. Paul David의 전기화 역사 분석입니다. 전기가 도입된 모든 공장에서 효과가 전혀 없었다는 뜻이 아닙니다. 기존 동력원 교체만으로는 개별 모터와 공정 재배치의 이점을 모두 얻기 어려웠습니다. 조직 변화와 보완 투자가 중요하다는 해석을 AX에 적용합니다. 화살표는 개념도이며 계량 그래프가 아닙니다.',['electricity'],{theme:'light'});
add('SHIFT','comparison','새 매체에, 오래된 절차를 복사할 때.',cards([['EARLY WEB','브로슈어를 웹으로','초기 웹의 brochureware는 인쇄물의 구성과 디자인을 그대로 옮겼다. 매체의 상호작용을 충분히 쓰지 못했다.'],['TODAY / 강의용 예시','종이 양식을 챗봇으로','신청서를 AI가 작성해도, 재입력·순차 승인·대기 시간이 그대로라면 전체 흐름은 크게 달라지지 않는다.']],'two')+call('“이 단계를 더 빨리 할까?”와 함께 <strong>“이 단계가 아직 필요한가?”</strong>를 묻자.'),'1분 30초. NN/g가 회고한 1994년 웹의 brochureware 사례를 사용합니다. 오른쪽 신청서 사례는 특정 기업에 대한 역사적 사실이 아닌 설명용 예시입니다. 디지털 양식 자체가 나쁘다는 뜻이 아닙니다. 고객이 원하는 결과까지의 전체 과정을 보자고 제안하세요.',['web']);
add('SHIFT','case','스마트폰은, 작은 PC를 넘어섰다.',flow([['새로운 조건','항상 연결 + 위치 + 카메라'],['새로운 연결','앱 유통 + 결제 + 실시간 매칭'],['새로운 서비스','이동·배달·콘텐츠 소비의 재구성']])+call('AI도 기존 화면 안의 기능을 넘어, <strong>서비스가 작동하는 방식</strong>을 바꿀 수 있다.')+`<p class="fine">2008년 앱스토어 출범은 한 변곡점. 산업 변화는 하드웨어·통신·사업 모델이 함께 만든 결과입니다.</p>`,'1분 30초. 앱스토어 출범과 서비스 생태계의 변화에 근거를 두되 특정 회사 하나가 모든 변화를 만들었다고 설명하지 않습니다. 위치, 카메라, 상시 연결이 어떤 새 사업을 가능하게 했는지 청중에게 떠올리게 합니다. 마지막 AI 문장은 역사적 사실이 아니라 유추입니다.',['appstore']);
add('SHIFT','workflow','Agent가 들어오면, 검토 지점도 바뀐다.',`<span class="label">실제 제품 사례 / GitHub Copilot coding agent</span>${flow([['사람: 문제 정의','이슈·완료 기준·제약'],['Agent: 작업 수행','코드 변경·테스트·PR'],['사람: 검토·통합','변경의 적합성과 위험 판단']])}${cards([['CHANGE','인수인계가 명세가 된다','기대 결과, 사용 가능한 정보, 건드리지 않을 범위를 명확히 한다.'],['DESIGN','자율성의 경계를 정한다','실행 권한·예산·중단 조건·검토 책임자를 설계한다.']],'two')}`,'2분. 2025년 공개된 제품 워크플로를 사례로 사용합니다. 가능한 기능이 실제 품질이나 자율 해결률을 보장하지는 않습니다. AI에게 PR을 맡기는 일과 운영 배포 권한을 부여하는 일은 다른 결정입니다. PR은 코드 변경 검토 요청이라고 설명하세요. 측정 데이터 분석 코드도 이 흐름으로 만들 수 있지만 장비 제어나 시험 승인까지 같은 수준으로 위임하는 것은 아닙니다.',['copilot']);
add('SHIFT','comparison','AI를 쓰는 것과, AI Native하게 일하는 것.',cards([['TOOL USE','보고서 한 단계만 가속','측정값을 매번 복사한다.<br>AI로 결과 설명을 작성한다.<br>원본 확인과 수정은 뒤로 밀린다.'],['AI NATIVE','시험부터 검토까지 연결','시험 조건·단위·원본을 연결한다.<br>분석 코드와 결과를 함께 남긴다.<br>담당자가 근거를 확인하고 승인한다.']],'two')+call('성과는 작성 속도보다 <strong>전체 소요 시간 · 오류 · 재현 가능성</strong>으로 본다.'),'2분. 시험 결과 보고서의 강의용 설계 예시입니다. 원본 데이터와 조건을 연결하고 분석을 다시 실행할 수 있게 남기는 것이 핵심입니다. AI Native가 사람의 검토를 없앤다는 뜻은 아닙니다. 기록 누락과 재작업을 줄이는 전체 흐름의 변화를 설명하세요.',[],{theme:'light'});
chapter(4,'ENGINEER','엔지니어의 역할은 어떻게 달라지는가?','구현의 힘을 유지하며, 설계와 검증의 범위를 넓힌다.');
add('ENGINEER','comparison','도구가 맡는 층이 올라가면, 질문도 올라간다.',cards([['CALCULATOR','계산기와 수학자','계산을 빠르게 해도, 어떤 문제를 정의하고 무엇을 증명할지는 남는다.'],['CAD','CAD와 설계자','선을 그리고 수정하기 쉬워져도, 제약·공차·제조 가능성은 판단해야 한다.'],['COMPILER','컴파일러와 프로그래머','명령어를 직접 쓰는 부담이 줄어도, 문제를 프로그램으로 표현하는 일은 남는다.']])+`<p class="fine">역사에서 이끌어낸 역할 변화의 비유입니다. AI의 오류 방식은 계산기·컴파일러와 다릅니다.</p>`,'2분. 계산기는 수학을 계산만으로 환원할 수 없다는 비유입니다. CAD 초기 사례로 1963년 Sketchpad를 들 수 있습니다. FORTRAN 당시 수작업 코드만큼 효율적일지 회의가 있었다는 사실은 확인됩니다. “프로그래머는 사라질 것이다”라는 널리 알려진 문장을 특정 인물의 검증된 직접 인용으로 쓰지 않습니다. LLM은 정답 보장이 있는 컴파일러와 다릅니다.',['cad','fortran']);
add('ENGINEER','timeline','검색하던 사람에서, 작업을 설계하는 사람으로.',flow([['Stack Overflow','답변을 찾고 맥락에 적용'],['Copilot','코드 제안을 읽고 선택'],['Coding Agent','작업을 위임하고 결과 검증']])+cards([['LESS FRICTION','줄어드는 마찰','문법 기억, 반복 코드, 파일을 오가는 수작업.'],['MORE SCOPE','넓어지는 책임','문제 분해, 아키텍처, 변경의 영향, 운영 결과.']],'two'),'1분 30초. 세 도구가 순서대로 완전히 교체됐다는 뜻이 아닙니다. 검색·자동완성·작업 위임은 공존합니다. Stack Overflow는 개발자 질의응답 사이트, Copilot은 코드 제안 도구, Coding Agent는 여러 단계의 코딩 작업을 수행하는 AI라고 풀어 설명합니다. 측정 데이터 분석 코드도 같은 흐름으로 작성할 수 있지만 요구가 잘못되면 잘못된 분석도 빨라집니다.',['copilotHistory']);
add('ENGINEER','case','자동화된 조종석에도, 조종사는 필요하다.',cards([['OPERATE','직접 조작','기본 조작과 비상 대응 능력을 유지한다.'],['MONITOR','시스템 이해','현재 모드, 경로, 계기와 자동화의 한계를 파악한다.'],['DECIDE','상황 판단','언제 개입하고, 어떤 자동화를 해제할지 결정한다.']])+call('“조작 → 판단”은 강조점의 이동이다. <strong>조작 능력을 버리라는 뜻은 아니다.</strong>'),'2분. NASA ASRS의 자동화 관련 사례는 상황 인식과 모니터링의 중요성을 보여줍니다. 인간이 항상 자동화보다 더 안전하다는 결론도 피합니다. 엔지니어도 시스템의 내부 동작을 모르면서 최종 승인만 하는 역할에 머물러서는 안 된다는 연결을 합니다.',['nasa']);
add('ENGINEER','evidence','Junior Engineer의 역설.',`<div class="split"><div><h2>AI로 끝낼 수 있지만,<br><span class="accent">설명할 수 없을 때.</span></h2><p class="lead">검증하려면 실력이 필요하다.<br>그 실력을 쌓을 연습을 AI에 모두 넘긴다면?</p></div><div><span class="label">새 라이브러리 학습 후 퀴즈 평균 / 2026 연구</span><div class="bar-pair" role="img" aria-label="AI 사용 그룹 50%, 직접 코딩 그룹 67%"><div class="bar-row"><span>AI 사용</span><div class="bar-track"><div class="bar-fill dim" style="width:50%">50%</div></div></div><div class="bar-row"><span>직접 코딩</span><div class="bar-track"><div class="bar-fill" style="width:67%">67%</div></div></div></div><p class="fine">단기 학습 실험의 결과. 모든 AI 사용이나 장기 숙련에 대한 결론은 아닙니다.</p></div></div>`,'2분. Anthropic의 2026년 연구는 새로운 비동기 라이브러리 학습 후 퀴즈를 비교했습니다. 사용 그룹 50%, 직접 코딩 그룹 67%였습니다. 작업 시간 차이는 통계적으로 유의하지 않았습니다. 사용 방식별 차이는 탐색적 관찰이며 특정 프롬프트가 학습 향상을 보장한다는 인과 근거가 아닙니다. 회사도 학습 시간을 업무 설계에 포함해야 한다는 점을 강조하세요.',['skills']);
add('ENGINEER','principle','결과를 얻는 루프와, 원리를 배우는 루프.',cards([['DELIVER','업무를 완수한다','요구·조건 정의 → AI 활용 → 계산·시험 → 검토 → 결과 확인'],['LEARN','내 실력을 쌓는다','손계산으로 크기 예상 → 작은 실험·구현 → 결과 비교 → 차이 설명']],'two')+call('캡스톤에서 “돌아갔다” 다음은, <strong>왜 되고 언제 안 되는지 설명하는 것.</strong>'),'1분 30초. 공학 실험과 캡스톤 경험에 연결합니다. 손계산, 간단한 회로 실험, 작은 코드 실행처럼 핵심 원리를 확인할 수 있는 작은 과제를 예로 드세요. 모든 작업을 수작업으로 반복하라는 의미가 아닙니다. 멘토링과 검토 시간을 조직도 마련해야 합니다.',[],{theme:'light'});
add('ENGINEER','takeaway','해석이 끝나도, 검증은 남는다.',`<p class="lead">AI가 “시뮬레이션 결과, 요구 성능을 만족합니다”라고 보고했다.</p><div class="question-card"><b>01</b>입력·단위·재료 물성·경계조건이 실제 조건과 맞는지 확인한다.</div><div class="question-card"><b>02</b>허용오차와 조건 변화에도 결론이 유지되는지 확인한다.</div><div class="question-card"><b>03</b>독립 계산·측정·시험으로 결과를 확인하고 한계를 기록한다.</div>${call('계산이 완료됐다는 사실은 <strong>모델이 현실에 맞다는 증거</strong>가 아니다.')}`,'1분 30초. 구조·열·회로·공정 해석에 연결할 수 있는 가상 사례입니다. 모델 내부 계산의 정확성과 실제 현상을 표현하는 적합성을 구별합니다. 소프트웨어에서도 테스트 입력과 실제 사용 조건의 차이가 같은 쟁점입니다. 신입은 조건과 근거를 정리하고, 권한 있는 담당자와 함께 검토합니다.');
chapter(5,'HUMAN','AI 시대에 인간에게 더 중요한 것은?','더 좋은 답을 요구하고, 더 엄격하게 평가하는 힘.');
add('HUMAN','case','37수와 78수. 두 장면을 함께 기억하자.',`<div class="grid two"><div class="card"><span class="label">GAME 2 / ALPHAGO</span><div class="big-number">37</div><h3 style="margin-top:25px">낯선 답을 받아들이는 겸손</h3><p>사람의 직관과 다른 수가 좋은 수일 수 있다.</p></div><div class="card"><span class="label">GAME 4 / LEE SEDOL</span><div class="big-number">78</div><h3 style="margin-top:25px">강한 시스템에도 질문하는 용기</h3><p>이세돌의 78수 이후 알파고가 흔들렸고, 이세돌은 4국을 이겼다.</p></div></div>`,'2분. 78수는 제4국에서 이세돌이 둔 수입니다. 인간의 창의성이 영원히 AI를 능가한다는 증거로 사용하지 마세요. 37수도 기계에게 무조건 복종하라는 메시지가 아닙니다. 전문가의 직관과 강력한 시스템 둘 다 평가의 대상이라는 대칭이 중요합니다. 승패를 제외한 두 소제목은 강의의 해석입니다.',['alpha']);
add('HUMAN','case','허드슨강: 현실의 판단에는 맥락이 있다.',`<span class="label">US AIRWAYS 1549 / 15 JANUARY 2009</span><p class="statement">“어디로 돌아갈까?”보다<br><span class="accent">“지금 살아남을 가능성은?”</span></p><p class="lead">양쪽 엔진의 추력을 거의 잃은 상황에서 비상착수를 결정했다.<br>생환에는 조종실의 판단, 승무원의 대응, 구조 활동이 함께 작용했다.</p><p class="fine">질문 문장은 강의용 재구성입니다. 설렌버거 기장의 직접 인용이 아닙니다.</p>`,'2분. NTSB 보고서에 근거합니다. 영화 속 청문회 연출을 사고 조사 기록으로 쓰지 마세요. 이 사건은 AI가 틀리고 인간이 이긴 사례가 아니라 불완전한 정보, 시간 제약, 현실 조건 속 의사결정 사례입니다. 설렌버거 한 사람의 영웅담에 그치지 않고 부기장, 객실 승무원, 구조 체계를 함께 다루세요.',['hudson']);
add('HUMAN','case','GPS를 따라 도착했다. 길도 배웠을까?',cards([['OBSERVATION','도착과 학습은 다르다','GPS 사용이 많은 사람에게서 스스로 길을 찾을 때 공간 기억이 낮은 연관성이 관찰됐다.'],['LIMIT','연구의 범위를 지킨다','운전자 50명, 추적 13명의 연구. AI 사용이 뇌를 손상시킨다는 근거는 아니다.']],'two')+call('AI로 문제를 풀었을 때, <strong>내 안에도 지도가 생겼는가?</strong>'),'1분 30초. 2020년 Scientific Reports 연구입니다. 관찰과 작은 추적 표본의 한계를 반드시 말합니다. GPS와 AI 코딩은 같은 실험이 아니며, 마지막 질문은 학습을 위한 비유입니다. 의도적으로 기억하고 설명하는 연습이 필요하다는 방향으로 연결합니다.',['gps'],{theme:'light'});
add('HUMAN','concept','자동화 편향: “시스템이 그랬으니까.”',cards([['COMMISSION','틀린 제안을 따른다','AI가 자신 있게 제시한 원인을 다른 증거 없이 채택한다.'],['OMISSION','알림이 없어 놓친다','AI가 정상이라고 요약했기에 원본 측정값의 이상 징후를 확인하지 않는다.']],'two')+call('AI 답을 보기 전 가설을 적고, <strong>독립된 원본·실험·관측</strong>으로 확인하자.'),'1분 30초. 자동화 편향은 자동화의 제안을 독립적 정보 수집과 판단의 대체물로 쓰는 문제입니다. 카드의 측정값 사례는 강의용 가상 예시입니다. 모든 출력을 의심하느라 아무것도 못 하자는 뜻이 아니라, 위험과 불확실성에 비례해 확인 강도를 정하자는 제안입니다.',['bias']);
add('HUMAN','case','그럴듯한 참고문헌을, 연구자가 확인했다.',flow([['생성','AI가 문헌 목록을 작성'],['독립 확인','연구자가 데이터베이스·원문 대조'],['발견','존재하지 않는 인용과 서지 오류']])+call('출처가 있는 것처럼 보이는 답과 <strong>출처가 실제로 뒷받침하는 답</strong>은 다르다.')+`<p class="fine">Walters & Wilder, 2023 · 당시 모델의 실험입니다. 현재 모델의 오류율로 일반화하지 않습니다.</p>`,'1분 30초. 연구자들이 다학제 주제의 생성 문헌을 확인한 연구입니다. 출처의 존재, 서지 정보, 본문 주장과의 일치 여부를 나누어 검증하세요. AI에게 “정말 맞아?”라고 다시 묻는 것만으로 독립 검증이 되지 않습니다. 엔지니어 업무에서는 부품 데이터시트·시험 성적서·공식 API 문서를 원본과 대조하고, 계산·실험으로 확인하는 일이 이에 대응합니다.',['hallucination']);
add('HUMAN','principle','그럴듯한 답을 거르는, 공학의 기본기.',cards([['UNITS','단위와 차원','가상 예: AI가 10 N ÷ 2 mm²를 5 Pa라고 썼다.'],['ORDER OF MAGNITUDE','단위 환산과 크기','5 N/mm² = 5 MPa다. 단위 변환만으로도 오류를 찾는다.'],['VALIDATION','가정과 적용 범위','산술이 맞아도 이 값만으로 안전 판정은 못 한다. 하중 조건과 허용 기준을 더 확인한다.']])+call('AI의 유창함보다 <strong>단위 · 대략값 · 가정 · 실제 측정</strong>을 믿을 근거로 삼자.'),'1분 30초. 강의용으로 만든 단순 평균 응력 계산의 오류 예시이며 특정 모델의 실제 출력이 아닙니다. 1 mm²는 10의 -6승 m²이므로 10 N을 2 mm²로 나누면 5 MPa입니다. 이 계산만으로 실제 구조물의 안전성을 판단할 수 없습니다. 일반적인 답 평가 원칙을 공학의 단위 확인과 적용 범위 검토로 구체화합니다.');
add('HUMAN','takeaway','“AI가 만들었습니다”는, 설명의 끝이 될 수 없다.',`<p class="statement">기준과 승인자를 정하고,<br><span class="accent">결과를 돌볼 책임을<br>명확히 한다.</span></p><p class="lead">책임은 사람과 조직이 설계해야 한다.<br>권한·검토 시간·관측 수단 없이 “최종 책임자”만 두지 말자.</p>`,'1분 30초. 이 슬라이드는 법적 책임의 일률적 귀속이 아니라 운영상 책임 설계의 원칙을 다룹니다. 신입 한 사람에게 모든 결과의 책임을 떠넘기지 마세요. 작성자·리뷰어·서비스 소유자·조직의 권한과 역할이 함께 있어야 합니다. 변경을 중단할 권한과 장애를 발견할 수단도 책임과 함께 주어져야 한다고 설명하세요.',[],{theme:'acid'});
chapter(6,'CHOICE','나는 어떤 엔지니어가 될 것인가?','미래를 맞히는 대신, 다음 행동을 고른다.');
add('CHOICE','case','Centaur Chess: 함께 두는 방식도 경쟁력이다.',`<span class="label">1998 / ADVANCED CHESS</span><p class="statement">인간 + 컴퓨터 +<br><span class="accent">좋은 협업 방식</span></p><p class="lead">카스파로프는 인간이 컴퓨터의 도움을 받으며 두는 체스를 시도했다.<br>핵심 질문은 “누가 더 강한가?”에서 “어떻게 조합하는가?”로 이동한다.</p><p class="fine">인간+AI가 언제나 AI 단독보다 우월하다는 보편 법칙은 아닙니다.</p>`,'1분 30초. Advanced Chess와 이후 인간·컴퓨터 혼합 체스의 맥락입니다. 유명한 협업 우승 일화를 현재 모든 모델에 적용하는 공식으로 쓰지 않습니다. 잘못 개입하면 성능을 떨어뜨릴 수도 있습니다. AI를 경쟁자로 느끼는 감정은 자연스럽지만, 내가 설계할 수 있는 협업 방식을 찾아보자는 취지입니다.',['centaur']);
add('CHOICE','scenario','2031년, 당신이 Senior가 된 하루.',`<span class="tag">미래 예측이 아닌 설명용 가상 시나리오</span>${flow([['09:00 · 당신','문제·제약·우선순위를 정한다.'],['10:00 · Agents','자료 조사·분석 코드·검증 초안을 나눠 수행한다.'],['14:00 · 당신','충돌하는 근거와 대안을 판단한다.'],['17:00 · 팀','시험 결과로 설계 변경과 다음 실험을 정한다.']])}${call('Agent의 수보다 중요한 것: <strong>경계 · 인터페이스 · 증거 · 통합</strong>')}`,'2분. 2026년 입사자가 5년 뒤 일하는 가상 장면입니다. 누구나 5년 뒤 자동으로 Senior가 된다는 뜻은 아닙니다. 한 사람이 여러 에이전트와 일할 때 병목이 구현에서 통합과 검토로 옮겨갈 가능성을 생각해 봅니다. 독립된 에이전트도 같은 모델·자료를 쓰면 같은 오류를 공유할 수 있습니다.');
add('CHOICE','comparison','Answer Machine ↔ Thinking Partner',`<div class="grid two"><div><span class="label">답을 받는 사용</span><div class="prompt">“이 측정값으로 그래프를 그려줘.”<br>“이 계산을 코드로 옮겨줘.”</div><p class="fine">단위·입력 형식·원하는 출력을 명확히 지정한다.</p></div><div><span class="label">생각을 넓히는 사용</span><div class="prompt">“이 모델에서 빠진 가정은?”<br>“이 가설을 반박할 시험은?”<br>“대안의 비용·성능·제약을 비교해줘.”</div><p class="fine">AI의 제안도 원본 자료와 실험으로 확인한다.</p></div></div>${call('AI를 <strong>계산과 탐색의 도구</strong>이자, <strong>가설을 점검하는 파트너</strong>로 쓰자.')}`,'1분 30초. 공학 실험·설계 과제에서 사용할 수 있는 요청 예시입니다. 반복 작업에는 명확한 답을 받는 사용이 유용합니다. 설계 판단에는 가정·반례·대안을 넓히는 사용이 유용합니다. 모델이 제시한 시험과 대안도 실현 가능성과 근거를 사람이 검토합니다.',[],{theme:'light'});
add('CHOICE','takeaway','첫 AX 도입: 시험 결과 보고서부터.',`<p class="lead">예시: 승인된 시험 데이터 → 분석·그래프·초안 → 담당자 검토.</p>${cards([['01 / OUTCOME','반복 정리를 줄인다','측정 파일 취합과 그래프·표 작성 시간을 줄인다.'],['02 / BOUNDARY','원본과 판단을 지킨다','원본을 보존하고 단위·조건을 기록한다. AI는 초안, 합격 판정은 담당자.'],['03 / EVIDENCE','전후를 같은 기준으로 비교','검토·수정 포함 총 시간, 수치·단위 오류, 누락을 확인한다.']])}${call('첫 목표는 <strong>반복 정리의 자동화와 검증 가능한 결과</strong>다.')}`,'1분. 수업의 실험 보고서 경험에서 현업의 시험 보고서로 연결합니다. 강의용 AX 설계 예시입니다. 승인된 데이터·도구로 원본을 보존하며 적용하고, 시험 기준에 따른 합격 판정과 설비 변경 권한은 담당자에게 둡니다. 작업이 다른 전후 사례의 시간만 비교하지 말고 비슷한 조건과 같은 품질 기준으로 효과를 측정합니다.');
add('CHOICE','commitment','AI Native Generation의 출발선에서.',cards([['이번 주','하나를 직접 설명하기','AI와 만든 계산·분석 하나의 가정과 오차 원인을 설명한다.'],['첫 30일','하나를 측정하기','작은 업무에서 검토 시간을 포함한 전후 결과를 비교한다.'],['팀과 함께','하나의 기준 남기기','입력 데이터·단위·시험 조건·검증 방법을 다음 사람에게 남긴다.']])+call('신입의 장점은 익숙한 절차가 적다는 것. <strong>학습과 검증을 처음부터 습관으로 만들자.</strong>'),'1분 30초. AI Native Generation을 출생연도나 디지털 숙련의 보장으로 사용하지 않습니다. 입사 초기부터 AI와 함께 일하는 방식을 배울 기회라는 의미입니다. 구체적인 도구 숙련만이 아니라 타인에게 설명하고 실험 결과를 남기는 역량을 강조합니다.');
add('CHOICE','closing','What kind of engineer will you become?',`<span class="label">YOUR NEXT MOVE</span><h1>What kind of<br>engineer will<br><span class="accent">you become?</span></h1><p class="lead">AI로 가능성을 넓히고, <strong>원리를 배우며,</strong><br><strong>판단과 결과에 책임지는 엔지니어.</strong><br>그것이 우리가 지향할 엔지니어입니다.</p>`,'마무리 1분. AI 활용, 원리 학습, 검증과 책임이라는 결론을 전달하며 끝냅니다. 기술의 변화 속도와 관계없이 이 세 가지를 함께 키우는 것이 신입 엔지니어의 성장 방향입니다. 다음은 출처 부록입니다.',[],{custom:true,foot:'THE NEXT MOVE IS YOURS.'});

const deck=document.querySelector('#deck');

deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme||''} ${s.visual?'visual':''}" id="slide-${i+1}" aria-label="${i+1}. ${s.title}" ${i?'hidden':''}><div class="eyebrow"><span class="section">${s.chapter==='INTRO'?'INTRODUCTION':s.chapter==='SOURCES'?'READING & REFERENCES':'THE '+s.chapter}</span><span>${s.type==='chapter'?'SIX QUESTIONS FOR A NEW GENERATION':'AI & AX — ENGINEER ONBOARDING'}</span></div><div class="content">${s.custom?'':`<h2>${s.title}</h2>`}${s.body}</div><div class="bottom"><div class="refs">${s.refs.map(id=>`<a href="${sources[id][1]}" target="_blank" rel="noopener noreferrer">${sources[id][0]} ↗</a>`).join('')||`<span>${s.foot||'THE NEXT MOVE · 신입 엔지니어를 위한 여섯 개의 질문'}</span>`}</div><span>${String(i+1).padStart(2,'0')}</span></div></section>`).join('');
const toc=document.querySelector('#toc'),notes=document.querySelector('#notes'),imageDialog=document.querySelector('#image-dialog');
const sections=[...deck.children];
let current=0;
function go(index,hash=true){
 const next=Math.max(0,Math.min(slides.length-1,index));
 current=next;
 sections.forEach((el,i)=>{el.classList.toggle('active',i===current);el.hidden=i!==current;});
 document.querySelector('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;
 document.querySelector('#progress').style.width=`${(current+1)/slides.length*100}%`;
 document.querySelector('#chapter-label').textContent=slides[current].chapter==='INTRO'?'INTRODUCTION':slides[current].chapter==='SOURCES'?'REFERENCES':'THE '+slides[current].chapter;
 document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;
 document.querySelector('#announce').textContent=`${current+1} / ${slides.length}. ${slides[current].title}`;
 document.title=`${slides[current].title} — THE NEXT MOVE`;
 if(hash){try{history.replaceState(null,'',`#${current+1}`);}catch{location.hash=String(current+1);}}
 window.scrollTo({top:0,behavior:'instant'});
}
function fromHash(){const hash=location.hash.slice(1);if(hash.startsWith('chapter-')){const i=slides.findIndex(s=>s.type==='chapter'&&s.chapter.toLowerCase()===hash.slice(8));go(i<0?0:i);return;}const n=Number(hash);go(Number.isInteger(n)&&n>0?n-1:0,false);}
function openToc(){document.querySelector('#toc-list').innerHTML=slides.map((s,i)=>`<button data-go="${i}" class="${i===current?'current':''}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</button>`).join('');toc.showModal();requestAnimationFrame(()=>toc.querySelector('.current')?.scrollIntoView({block:'center'}));}
function openNotes(){const s=slides[current];document.querySelector('#notes-title').textContent=`${current+1}. ${s.title}`;document.querySelector('#notes-text').textContent=s.note;document.querySelector('#notes-sources').innerHTML=s.refs.map(id=>`<div><a href="${sources[id][1]}" target="_blank" rel="noopener noreferrer">${sources[id][0]} ↗</a><div class="fine">${sources[id][2]}</div></div>`).join('');notes.showModal();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch{document.querySelector('#announce').textContent='전체 화면을 열 수 없습니다. 브라우저의 전체 화면 메뉴를 사용하세요.';}}
document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.querySelector('#toc-open').onclick=openToc;document.querySelector('#notes-open').onclick=openNotes;
document.querySelectorAll('[data-close]').forEach(btn=>btn.onclick=()=>btn.closest('dialog').close());
toc.addEventListener('click',e=>{const button=e.target.closest('[data-go]');if(button){toc.close();go(Number(button.dataset.go));}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
window.addEventListener('hashchange',fromHash);
document.addEventListener('keydown',e=>{if(toc.open||notes.open||imageDialog.open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;const key=e.key.toLowerCase();if((key===' '||key==='enter')&&e.target.closest('button,a'))return;if(['arrowright','arrowdown','pagedown',' '].includes(key)){e.preventDefault();go(current+1);}else if(['arrowleft','arrowup','pageup'].includes(key)){e.preventDefault();go(current-1);}else if(key==='home'){e.preventDefault();go(0);}else if(key==='end'){e.preventDefault();go(slides.length-1);}else if(key==='o')openToc();else if(key==='n')openNotes();else if(key==='f')fullscreen();else if(key==='p'){e.preventDefault();window.print();}});
deck.addEventListener('click',e=>{const trigger=e.target.closest('[data-image]');if(!trigger)return;const asset=media[trigger.dataset.image];const img=trigger.querySelector('img');document.querySelector('#large-image').src=asset.file;document.querySelector('#large-image').alt=img.alt;document.querySelector('#image-title').textContent=img.alt;document.querySelector('#image-credit').innerHTML=trigger.closest('figure').querySelector('figcaption').innerHTML;imageDialog.showModal();});
let startTouch=null;deck.addEventListener('touchstart',e=>{if(e.target.closest('a,button'))return;startTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});deck.addEventListener('touchend',e=>{if(!startTouch)return;const dx=e.changedTouches[0].clientX-startTouch.x,dy=e.changedTouches[0].clientY-startTouch.y;startTouch=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(current+(dx<0?1:-1));},{passive:true});
fromHash();
</script>
</body>
